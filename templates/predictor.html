{% extends 'layout.html' %}

{% block content %}

<div class="glass-card">

    <h1>AI Student Prediction</h1>

    <form method="POST">

        <input
            type="number"
            name="study_hours"
            placeholder="Study Hours"
            required
        >

        <input
            type="number"
            name="attendance"
            placeholder="Attendance %"
            required
        >

        <input
            type="number"
            name="math_marks"
            placeholder="Math Marks"
            required
        >

        <input
            type="number"
            name="science_marks"
            placeholder="Science Marks"
            required
        >

        <input
            type="number"
            name="english_marks"
            placeholder="English Marks"
            required
        >

        <input
            type="number"
            name="computer_marks"
            placeholder="Computer Marks"
            required
        >

        <button type="submit">
            Predict Performance
        </button>

    </form>

</div>


<!-- =========================
        FOOTER
========================= -->

<footer class="premium-footer">

    <div class="footer-line"></div>

    <div class="footer-content">

        <p class="saffron">
            Designed and Developed by Raj
        </p>

        <p class="white">
            Sam Higginbottom University of Agriculture,
            Technology and Sciences
        </p>

        <p class="green">
            Naini, Prayagraj
        </p>

    </div>

</footer>


<style>

/* =========================
   PREMIUM FOOTER
========================= */

.premium-footer {
    width: 100%;
    margin-top: 50px;

    background: rgba(8, 15, 30, 0.95);

    border-top: 1px solid rgba(255,255,255,0.1);

    text-align: center;

    padding-bottom: 25px;

    box-shadow:
        0 -5px 30px rgba(0,0,0,0.3);
}


/* TRICOLOR LINE */

.footer-line {
    width: 100%;
    height: 5px;

    background: linear-gradient(
        90deg,
        #FF9933 0%,
        #FF9933 33.33%,
        #FFFFFF 33.33%,
        #FFFFFF 66.66%,
        #138808 66.66%,
        #138808 100%
    );

    box-shadow:
        0 0 12px rgba(255,153,51,0.5);
}


/* FOOTER CONTENT */

.footer-content {
    padding: 20px 15px 5px;
}


.footer-content p {
    margin: 7px 0;

    font-family: Arial, sans-serif;

    font-weight: 600;

    letter-spacing: 0.5px;
}


/* SAFFRON */

.saffron {
    color: #FF9933;

    font-size: 21px;
}


/* WHITE */

.white {
    color: #FFFFFF;

    font-size: 18px;
}


/* GREEN */

.green {
    color: #20c75a;

    font-size: 19px;
}


/* HOVER EFFECT */

.premium-footer:hover .footer-line {
    box-shadow:
        0 0 20px rgba(255,153,51,0.7),
        0 0 30px rgba(19,136,8,0.3);
}


/* =========================
   MOBILE RESPONSIVE
========================= */

@media (max-width: 600px) {

    .premium-footer {
        margin-top: 35px;
        padding-bottom: 18px;
    }

    .footer-content {
        padding: 16px 10px 3px;
    }

    .saffron {
        font-size: 17px;
    }

    .white {
        font-size: 14px;
        line-height: 1.5;
    }

    .green {
        font-size: 16px;
    }

}

</style>

{% endblock %}
