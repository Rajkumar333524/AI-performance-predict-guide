{% extends 'layout.html' %}

{% block content %}

<div class="glass-card chatbot-container">

    <h1>Educational AI Assistant</h1>

    <div id="chat-box">
    </div>

    <div class="input-box">

        <textarea
            id="message"
            placeholder="Ask anything....."
            rows="2"
        ></textarea>

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<!-- =========================
     TRICOLOR FOOTER
========================= -->

<footer class="tricolor-footer">

    <div class="footer-saffron"></div>

    <div class="footer-content">

        <p>
            Design and Developed by
            <span class="developer-name">Raj</span>
        </p>

        <span class="footer-divider">|</span>

        <p>
            Sam Higginbottom University of Agriculture,
            Technology and Sciences
        </p>

        <span class="footer-divider">|</span>

        <p>Naini, Prayagraj</p>

    </div>

    <div class="footer-green"></div>

</footer>


<style>

/* =========================
   CHATBOT
========================= */

.chatbot-container{
    max-width:1000px;
    margin:auto;
}


#chat-box{
    height:550px;
    overflow-y:auto;
    padding:20px;
    border-radius:20px;
    background:#081120;
    margin-bottom:20px;
}


.user-chat{
    max-width:75%;
    margin-left:auto;
    padding:15px;
    margin-top:15px;
    border-radius:20px;
    background:#0ea5e9;
    color:white;
    line-height:1.8;
    word-wrap:break-word;
}


.ai-chat{
    max-width:80%;
    padding:20px;
    margin-top:15px;
    border-radius:20px;
    background:#1e293b;
    color:white;
    line-height:1.9;
    word-wrap:break-word;
}


.ai-chat h3{
    margin-bottom:10px;
}


.input-box{
    display:flex;
    gap:15px;
}


textarea{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:17px;
    resize:none;
    outline:none;
}


button{
    padding:15px 25px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-size:17px;
}


.loading{
    font-style:italic;
    color:#38bdf8;
}


pre{
    background:black;
    padding:15px;
    border-radius:15px;
    overflow-x:auto;
}


code{
    color:#38bdf8;
}


/* =========================
   TRICOLOR FOOTER
========================= */

.tricolor-footer{
    width:100%;
    margin-top:45px;
    background:#ffffff;
    overflow:hidden;
    box-shadow:0 -4px 20px rgba(0,0,0,0.25);
}


/* Saffron Strip */

.footer-saffron{
    width:100%;
    height:7px;
    background:#FF9933;
}


/* Footer Main Area */

.footer-content{
    min-height:75px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:18px;

    padding:15px 25px;

    background:#ffffff;
    color:#111827;

    text-align:center;

    font-size:15px;
    font-weight:600;
}


.footer-content p{
    margin:0;
}


.developer-name{
    color:#FF671F;
    font-weight:800;
    font-size:16px;
}


.footer-divider{
    color:#000080;
    font-weight:bold;
    font-size:20px;
}


/* Green Strip */

.footer-green{
    width:100%;
    height:7px;
    background:#138808;
}


/* =========================
   MOBILE RESPONSIVE
========================= */

@media(max-width:768px){

    .chatbot-container{
        width:95%;
    }

    #chat-box{
        height:500px;
    }

    .footer-content{
        flex-direction:column;
        gap:7px;
        padding:18px 15px;
    }

    .footer-divider{
        display:none;
    }

}

</style>


<script>


function formatResponse(text){

    text=text.replace(/\n/g,"<br>");

    text=text.replace(/•/g,"<br> • ");

    return text;

}



async function sendMessage(){


    let message=
    document.getElementById("message").value.trim();


    if(!message){
        return;
    }


    let chatBox=
    document.getElementById("chat-box");


    chatBox.innerHTML+=`

    <div class="user-chat">

        <b>You</b><br><br>

        ${message}

    </div>

    `;


    document.getElementById("message").value="";


    chatBox.innerHTML+=`

    <div class="ai-chat loading"
    id="loading">

        AI is Thinking.....

    </div>

    `;


    chatBox.scrollTop=
    chatBox.scrollHeight;


    try{


        const response=
        await fetch(

            "/chat-api",

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    message:message
                })

            }

        );


        const data=
        await response.json();


        document.getElementById(
            "loading"
        ).remove();


        chatBox.innerHTML+=`

        <div class="ai-chat">

            <b>Educational AI Assistant</b>

            <br><br>

            ${formatResponse(data.response)}

        </div>

        `;


        chatBox.scrollTop=
        chatBox.scrollHeight;


    }


    catch(error){


        document.getElementById(
            "loading"
        ).remove();


        chatBox.innerHTML+=`

        <div class="ai-chat">

            Unable to connect with AI Server.

        </div>

        `;

    }


}



document.getElementById(
    "message"
).addEventListener(

    "keydown",

    function(event){


        if(
            event.key==="Enter"
            &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }

);


</script>

{% endblock %}
