{% extends 'layout.html' %}

{% block content %}

<div class="glass-card chatbot-container">

<h1>Educational AI Assistant</h1>

<div id="chat-box">

</div>


<div class="input-box">

<textarea

id="message"

placeholder="Ask anything....."

rows="2"

></textarea>


<button onclick="sendMessage()">

Send

</button>


</div>


</div>




<style>

.chatbot-container{

max-width:1000px;

margin:auto;

}


#chat-box{

height:550px;

overflow-y:auto;

padding:20px;

border-radius:20px;

background:#081120;

margin-bottom:20px;

}


.user-chat{

max-width:75%;

margin-left:auto;

padding:15px;

margin-top:15px;

border-radius:20px;

background:#0ea5e9;

color:white;

line-height:1.8;

word-wrap:break-word;

}


.ai-chat{

max-width:80%;

padding:20px;

margin-top:15px;

border-radius:20px;

background:#1e293b;

color:white;

line-height:1.9;

word-wrap:break-word;

}


.ai-chat h3{

margin-bottom:10px;

}


.input-box{

display:flex;

gap:15px;

}


textarea{

width:100%;

padding:15px;

border:none;

border-radius:15px;

font-size:17px;

resize:none;

outline:none;

}


button{

padding:15px 25px;

border:none;

border-radius:15px;

cursor:pointer;

font-size:17px;

}


.loading{

font-style:italic;

color:#38bdf8;

}


pre{

background:black;

padding:15px;

border-radius:15px;

overflow-x:auto;

}


code{

color:#38bdf8;

}


</style>




<script>


function formatResponse(text){


text=text.replace(/\n/g,"<br>");

text=text.replace(/•/g,"<br> • ");

return text;


}



async function sendMessage(){


let message=

document.getElementById("message").value.trim();


if(!message){

return;

}



let chatBox=

document.getElementById("chat-box");



chatBox.innerHTML+=`

<div class="user-chat">

<b>You</b><br><br>

${message}

</div>

`;


document.getElementById("message").value="";



chatBox.innerHTML+=`

<div class="ai-chat loading"

id="loading">

AI is Thinking.....

</div>

`;



chatBox.scrollTop=

chatBox.scrollHeight;



try{


const response=

await fetch(

"/chat-api",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

message:message

})

}

);



const data=

await response.json();



document.getElementById(

"loading"

).remove();



chatBox.innerHTML+=`

<div class="ai-chat">

<b>Educational AI Assistant</b>

<br><br>

${formatResponse(data.response)}

</div>

`;



chatBox.scrollTop=

chatBox.scrollHeight;



}


catch(error){


document.getElementById(

"loading"

).remove();



chatBox.innerHTML+=`

<div class="ai-chat">

Unable to connect with AI Server.

</div>

`;


}



}



document.getElementById(

"message"

).addEventListener(

"keydown",

function(event){


if(

event.key==="Enter"

&&

!event.shiftKey

){

event.preventDefault();

sendMessage();

}


}


);


</script>


{% endblock %}
